name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/the-lost-kingdom.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-lost-kingdom-android
          path: build/the-lost-kingdom.apk
          if-no-files-found: error
          retention-days: 14
