name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Godot 4.3 export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          apt-get update -qq && apt-get install -y -qq unzip
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          if [ -f /tmp/godot-templates/version.txt ]; then cp /tmp/godot-templates/version.txt "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"; fi
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          mkdir -p /root/.android
          keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android SDK components required by Godot 4.3
        env:
          ANDROID_HOME: /usr/lib/android-sdk
        run: |
          set -eux
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -a "$(dirname "$(dirname "$SDKMANAGER")")/." "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"

      - name: Configure Godot Android SDK settings
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools"
          test -d "$ANDROID_HOME/platforms"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Export Android APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -eux
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/the-lost-kingdom.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-lost-kingdom-android
          path: build/the-lost-kingdom.apk
          if-no-files-found: error
          retention-days: 14
