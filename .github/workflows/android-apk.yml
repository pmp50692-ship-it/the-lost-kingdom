name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Godot 4.3 export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          apt-get update -qq && apt-get install -y -qq unzip
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          if [ -f /tmp/godot-templates/version.txt ]; then cp /tmp/godot-templates/version.txt "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"; fi
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          mkdir -p /root/.android
          keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/the-lost-kingdom.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-lost-kingdom-android
          path: build/the-lost-kingdom.apk
          if-no-files-found: error
          retention-days: 14
